<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>5 x mi</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: #f0fdfa;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #134e4a
    }

    .fade {
      animation: fadeUp .45s ease both
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .chip {
      transition: all .2s
    }

    .chip:hover {
      transform: translateY(-2px)
    }

    .on {
      background: #14b8a6 !important;
      color: #fff !important;
      border-color: #0d9488 !important
    }
  </style>
</head>

<body>
  <div class="flex flex-col h-full max-w-2xl mx-auto">
    <header class="flex items-center justify-between px-4 py-3 bg-white/80 border-b border-teal-100">
      <h1 class="text-xl font-bold text-teal-700">5 x mi</h1>
      <button id="reset" class="text-xs text-teal-600 hover:text-teal-800 underline">Reiniciar Demo</button>
    </header>
    <main id="chat" class="flex-1 overflow-y-auto px-4 py-5 space-y-4"></main>
    <footer id="actions" class="px-4 py-4 bg-white/80 border-t border-teal-100 min-h-[110px]"></footer>
  </div>
  <script>
    const KEY = "5xmi_done";
    const $ = id => document.getElementById(id);
    const chat = $("chat"), actions = $("actions");
    const EMOTIONS = ["Trist/a", "Cansat/da", "Estressat/da", "Alegre", "Neutre/a"];
    let state = { emotion: null, intensity: null, act: null };
    const btn = "chip px-4 py-2 rounded-full bg-teal-50 border border-teal-300 text-teal-800 hover:bg-teal-100";
    const main = "px-6 py-2 rounded-full bg-teal-600 text-white hover:bg-teal-700 transition";

    const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") };
    const isDone = () => { try { return localStorage.getItem(KEY) === today() } catch (e) { return false } };
    const saveDone = () => { try { localStorage.setItem(KEY, today()) } catch (e) { } };
    const clearDone = () => { try { localStorage.removeItem(KEY) } catch (e) { } };

    function bot(t) {
      const d = document.createElement("div"); d.className = "fade flex gap-2 items-end";
      d.innerHTML = '<div class="w-8 h-8 shrink-0 rounded-full bg-teal-500 text-white text-xs font-bold flex items-center justify-center">5</div><div class="bg-white border border-teal-100 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm max-w-[85%]"></div>';
      d.lastChild.textContent = t; chat.appendChild(d); chat.scrollTop = chat.scrollHeight
    }
    function me(t) {
      const d = document.createElement("div"); d.className = "fade flex justify-end";
      d.innerHTML = '<div class="bg-teal-600 text-white rounded-2xl rounded-br-sm px-4 py-2 shadow-sm max-w-[85%]"></div>';
      d.firstChild.textContent = t; chat.appendChild(d); chat.scrollTop = chat.scrollHeight
    }
    function setActions(html, bind) { actions.style.opacity = 0; setTimeout(() => { actions.innerHTML = '<div class="fade">' + html + '</div>'; actions.style.opacity = 1; if (bind) bind() }, 150) }

    // Activitats: obertes (open, amb validació) o de resposta exacta (a = respostes acceptades, s = solució). Se n’escull una a l’atzar.
    const PRE = "Entès. Avui farem una activitat suau 🌿";
    const ACTS = {
      "Trist/a": {
        hi: [
          { open: 1, max: 3, pre: PRE, t: "Escriu una sola paraula que descrigui què necessites avui per estar en pau 🌱", ok: "Gràcies per compartir-ho. Posar nom al que necessites ja és un bon exercici per a la ment." },
          { open: 1, max: 3, letter: "s", pre: PRE, t: "Escriu una paraula que comenci per la lletra S i que et transmeti seguretat 🧣", ok: "Gràcies. Un petit joc de paraules, sense pressa." },
          { open: 1, max: 4, pre: PRE, t: "Pensa en un so que t’agradi (pluja, mar, música…) i escriu-lo amb una sola paraula 🎧", ok: "Gràcies per compartir-ho. Recordar sons agradables també exercita la ment." }],
        lo: [
          { open: 1, max: 8, t: "Un exercici d’imaginació, sense pressa: pensa en un lloc on et sentis tranquil/a i descriu-lo amb tres paraules 🏞️", ok: "Gràcies per compartir-ho. Imaginar un lloc agradable és una manera suau d’exercitar la ment." },
          { open: 1, max: 12, t: "Escriu tres coses petites que et facin sentir bé: un color, un menjar, un moment del dia… ☕", ok: "Gràcies per compartir-ho. Fixar-se en els petits detalls és un bon exercici d’atenció." },
          { open: 1, max: 8, t: "Escriu el títol d’una cançó, d’un llibre o d’una pel·lícula que t’agradi 🎶", ok: "Gràcies per compartir-ho. Recordar una història o una melodia també és exercitar la ment." }]
      },
      "Cansat/da": {
        hi: [
          { open: 1, max: 3, letter: "m", pre: PRE, t: "Escriu una paraula que comenci per la lletra M i que et transmeti calma 🌙", ok: "Molt bé. Un petit joc de paraules, sense pressa." },
          { open: 1, max: 3, letter: "p", pre: PRE, t: "Escriu una paraula que comenci per la lletra P i que et recordi el descans 🛋️", ok: "Molt bé. Un petit joc de paraules, sense pressa." },
          { open: 1, max: 4, pre: PRE, t: "Escriu el nom d’una beguda calenta que t’agradi ☕", ok: "Gràcies. Una manera tranquil·la de començar a despertar la ment." }],
        lo: [
          { a: ["foscor", "la foscor", "fosca", "la fosca", "obscuritat", "l’obscuritat", "tenebres", "les tenebres"], s: "la foscor", t: "Una endevinalla suau: com més n’hi ha, menys es veu. Què és? 🌑" },
          { a: ["rellotge", "un rellotge", "el rellotge"], s: "un rellotge", t: "Una endevinalla suau: tinc agulles però no cuso, tinc números però no sóc un llibre. Què sóc? 🕰️" },
          { a: ["tardor", "la tardor"], s: "la tardor", t: "Un repte tranquil: quina estació de l’any ve després de l’estiu? 🍂" }]
      },
      "Estressat/da": {
        hi: [
          { open: 1, max: 12, t: "Anem a centrar l’atenció. Mira al teu voltant i escriu tres objectes que vegis de color blau o verd 👀", ok: "Bona feina. Observar el que tens al voltant és una manera suau de centrar l’atenció." },
          { open: 1, max: 12, t: "Anem a centrar l’atenció. Escriu tres sons que sentis ara mateix, per petits que siguin 👂", ok: "Bona feina. Escoltar el que tens al voltant és una manera suau de centrar l’atenció." },
          { open: 1, max: 3, letter: "c", t: "Escriu una paraula de la natura que comenci per la lletra C 🌳", ok: "Bona feina. Un petit joc de paraules per fer una pausa." }],
        lo: [
          { a: ["silenci"], s: "silenci", t: "Un joc de concentració, sense pressa: ordena aquestes lletres per formar una paraula relaxant: L-E-C-I-N-S-I 🤫" },
          { a: ["calma"], s: "calma", t: "Un joc de concentració, sense pressa: ordena aquestes lletres per formar una paraula relaxant: L-A-C-M-A 🍃" },
          { a: ["blau", "el blau"], s: "el blau", t: "Completa la sèrie de colors de l’arc de Sant Martí: vermell, taronja, groc, verd, … 🌈" }]
      },
      "Alegre": {
        hi: [
          { a: ["mapa", "un mapa", "el mapa"], s: "un mapa", t: "Tens energia per a un repte una mica més exigent. Endevinalla: tinc ciutats però no tinc cases, tinc rius però no tinc aigua, tinc carreteres però no tinc cotxes. Què sóc? 🗺️" },
          { a: ["igual", "pesen igual", "el mateix", "pesen el mateix", "els dos", "tots dos"], s: "pesen igual", t: "Un repte de lògica: què pesa més, un quilo de plomes o un quilo de ferro? 🪶" },
          { a: ["panorama"], s: "panorama", t: "Un repte de paraules: quina paraula amaga aquest anagrama? R-A-M-A-N-O-P-A 🔤" }],
        lo: [
          { a: ["cadira", "la cadira"], s: "la cadira", t: "Un repte de lògica: quina d’aquestes paraules no pertany al grup? Poma, pera, taronja, cadira, plàtan 🍎" },
          { a: ["febrer", "el febrer"], s: "febrer", t: "Un repte de cultura general: quin és el mes més curt de l’any? 📅" },
          { a: ["dijous", "el dijous"], s: "dijous", t: "Completa la sèrie: dilluns, dimarts, dimecres, … 🗓️" }]
      },
      "Neutre/a": {
        any: [
          { a: ["forat", "un forat", "el forat"], s: "un forat", t: "Aquí tens el teu repte d’avui, una endevinalla: què és allò que com més en treus, més gran es fa? 🕳️" },
          { a: ["ampolla", "una ampolla", "l’ampolla"], s: "una ampolla", t: "Aquí tens el teu repte d’avui, una endevinalla: què té coll però no té cap? 🍾" },
          { a: ["verd", "el verd"], s: "el verd", t: "Aquí tens el teu repte d’avui: quin color resulta de barrejar el blau i el groc? 🎨" }]
      }
    };
    const pickAct = (e, n) => { const o = ACTS[e], l = o.any || (n >= 7 ? o.hi : o.lo); return l[Math.floor(Math.random() * l.length)] };
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?¡¿\s]+$/g, "").trim();
    const isOk = v => state.act.a.some(x => norm(x) === norm(v));
    // Error 4: consulta fora de l’àmbit
    const oos = v => { const w = norm(v).split(/\s+/); return /\?/.test(v) || (w.length >= 3 && /^(quant|quan|quin|quina|quins|quines|puc|pots|podries|cuanto|como|donde|quien)$/.test(w[0])) };
    // Error 3: resposta fora de context en activitats obertes
    const semOk = (v, a) => {
      const w = v.split(/\s+/).filter(Boolean);
      if (w.length > a.max || !/\p{L}/u.test(v) || /\d/.test(v)) return false;
      if (w.some(x => x.length >= 3 && !/[aeiouàèéíòóú]/i.test(x)) || /(.)\1{3,}/.test(v)) return false;
      if (a.letter && norm(w[0])[0] !== a.letter) return false; return true
    };

    // Selecció + "Continuar" (Error 1: falta d’entrada)
    function choose(items, grid, cb, err) {
      let sel = null;
      setActions('<div class="' + grid + '">' + items.map(x => '<button type="button" class="' + btn + ' opt" data-v="' + x + '">' + x + '</button>').join("") + '</div><div class="mt-3 text-center"><button id="go" class="' + main + '">Continuar</button></div>', () => {
        actions.querySelectorAll(".opt").forEach(b => b.onclick = () => { sel = b.dataset.v; actions.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o === b)) });
        $("go").onclick = () => { if (!sel) { bot(err); return } actions.innerHTML = ""; cb(sel) };
      });
    }
    function step1() {
      bot("Hola! Sóc el bot 5 x mi, tens 5 minuts per exercitar la teva ment amb un petit repte? Digue’m com et sents avui seleccionant un dels botons 🌿 ");
      choose(EMOTIONS, "flex flex-wrap gap-2 justify-center", pickEmotion, "Necessito saber com et sents per poder adaptar l’activitat d’avui, em pots indicar una emoció, si us plau?");
    }
    function pickEmotion(e) {
      state.emotion = e; me(e);
      setTimeout(() => {
        bot("Ara, escriu-me de l'1 al 10 quanta intensitat té aquesta emoció (on 1 és poc i 10 és molt)");
        choose(Array.from({ length: 10 }, (_, i) => String(i + 1)), "grid grid-cols-5 sm:grid-cols-10 gap-2", pickIntensity, "Necessito saber com et sents per poder adaptar l’activitat d’avui, em pots indicar el número de l’escala, si us plau?");
      }, 500);
    }
    function pickIntensity(n) {
      state.intensity = +n; me(n);
      const act = pickAct(state.emotion, +n); state.act = act;
      setTimeout(() => { if (act.pre) bot(act.pre); setTimeout(() => { bot(act.t); input() }, act.pre ? 700 : 0) }, 500);
    }
    function input() {
      setActions('<form id="f" class="flex gap-2"><input id="inp" type="text" placeholder="Escriu la teva resposta…" autocomplete="off" class="flex-1 min-w-0 px-4 py-2 rounded-full border border-teal-300 bg-white focus:outline-none focus:ring-2 focus:ring-teal-400"><button class="' + main + '">Enviar resposta</button></form>', () => { $("f").onsubmit = submit; $("inp").focus({ preventScroll: true }) });
    }
    function twoBtns(l1, l2, f1, f2) {
      setActions('<div class="flex flex-wrap gap-2 justify-center"><button id="b1" class="' + btn + '">' + l1 + '</button><button id="b2" class="' + btn + '">' + l2 + '</button></div>', () => {
        $("b1").onclick = () => { actions.innerHTML = ""; f1() }; $("b2").onclick = () => { actions.innerHTML = ""; f2() }
      });
    }
    const endHere = () => { bot("D’acord, cap problema. Gràcies per participar avui 🌿"); finish() };
    function submit(ev) {
      ev.preventDefault(); const v = $("inp").value.trim(), a = state.act;
      if (!v) { bot("Necessito una resposta per poder continuar. Pots escriure-la al camp de text, si us plau?"); return }
      me(v); actions.innerHTML = "";
      setTimeout(() => {
        if (oos(v)) { bot("Recorda que sóc el bot 5 x mi i no puc oferir informació general. Sóc aquí per ajeudar-te a exercitar la ment durant 5 minuts. Vols que continuem amb el repte d'avui?"); twoBtns("Continuar amb el repte", "Acabar aquí", input, endHere); return }
        if (a.open) {
          if (!semOk(v, a)) { bot("No t’he entès bé, vols intentar-ho de nou o acabar aquí el repte?"); twoBtns("Intentar-ho de nou", "Acabar aquí", input, endHere); return }
          bot(a.ok); finish(); return
        }
        if (isOk(v)) { bot("Exacte! Molt bé ✨ Has completat el teu repte d’avui."); finish() }
        else {
          bot("Quasi! 🙂 Però no és la resposta exacte. Vols intentar-ho un altre cop o prefereixes que et dongui la solució?");
          twoBtns("Tornar-ho a intentar", "Veure la solució", input, () => { bot("La solució era " + a.s + ". Gràcies per participar avui 🌿"); finish() })
        }
      }, 500);
    }
    function finish() { saveDone(); actions.innerHTML = ""; setTimeout(() => showFinal(false), 1400) }
    function showFinal(already) {
      chat.innerHTML = ""; actions.innerHTML = "";
      const d = document.createElement("div"); d.className = "fade text-center bg-white border border-teal-100 rounded-3xl shadow-sm p-8 mt-6";
      d.innerHTML = '<div class="text-5xl mb-4">🌿</div><h2 class="text-xl font-semibold text-teal-700 mb-3"></h2><p class="text-teal-900/80"></p>';
      d.querySelector("h2").textContent = already ? "Ja has fet el repte d’avui" : "Molt bé! ✨";
      d.querySelector("p").textContent = "Has dedicat uns minuts per a tu. El bot 5 x mi tornarà a estar actiu demà a les 00:00h per a un nou repte diari.";
      chat.appendChild(d);
    }
    $("reset").onclick = () => { clearDone(); state = { emotion: null, intensity: null, act: null }; chat.innerHTML = ""; actions.innerHTML = ""; init() };
    function init() { if (isDone()) showFinal(true); else step1() }
    init();
  </script>
</body>

</html>
